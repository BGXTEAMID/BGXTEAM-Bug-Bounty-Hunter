[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bgxteam-bbh"
version = "2.0.0"
description = "Database-free, scope-first security assessment automation toolkit"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
bgx = "bgx:main"

[tool.setuptools]
py-modules = ["bgx", "bot"]

[tool.setuptools.packages.find]
include = ["core*", "findings*", "integrations*", "policies*", "reports*", "storage*"]

[project.optional-dependencies]
bot = ["aiogram>=3.13,<4"]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]
platform = ["aiogram>=3.13,<4", "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
