[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bgxteam-bbh"
version = "1.0.0"
description = "Database-free, scope-first Telegram security research assistant"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
bot = ["aiogram>=3.13,<4"]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
